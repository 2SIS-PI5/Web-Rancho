<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rancho do Comanche — Login</title>
  <meta name="description" content="Sistema de gestão de pagamentos do Rancho do Comanche." />
  <link rel="stylesheet" href="../css/rancho.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <!-- Logo + Título -->
    <div class="auth-logo-wrap">
      <div class="auth-logo-icon">
        <!-- Lucide LogIn icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
             fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" x2="3" y1="12" y2="12"/>
        </svg>
      </div>
      <h1>Rancho do Comanche</h1>
      <p>Sistema de Gestão de Pagamentos</p>
    </div>

    <!-- Alerta -->
    <div id="alert-box" class="alert hidden"></div>

    <!-- Formulário -->
    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               placeholder="seu@email.com" autocomplete="email" required />
        <span class="field-error">Informe um e-mail válido.</span>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-eye">
          <input type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="btn-eye" onclick="toggleEye('password', this)" title="Ver senha">
            <i class="fa fa-eye"></i>
          </button>
        </div>
        <span class="field-error">Informe sua senha.</span>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="btn-login"
              style="margin-top: 8px;">
        <span id="btn-login-text">Entrar</span>
        <span id="btn-login-spinner" class="spinner hidden"></span>
      </button>

    </form>

    <!-- Rodapé -->
    <div class="auth-footer">
      <p>Acesso exclusivo para gestores</p>
    </div>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // ── Redirect if already logged in ──
    if (localStorage.getItem('rc_token')) {
      window.location.href = 'app.html';
    }

    // ── Login Form Handler ──
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      clearAlert();
      let valid = true;

      if (!isValidEmail(email)) { setFieldError('email', true); valid = false; }
      else                       { setFieldError('email', false); }

      if (!password) { setFieldError('password', true); valid = false; }
      else           { setFieldError('password', false); }

      if (!valid) return;

      setLoading(true);

      try {
        const result = await AuthService.login(email, password);
        localStorage.setItem('rc_token', result.token || 'demo-token');
        localStorage.setItem('rc_user', JSON.stringify(result.user || { name: email.split('@')[0], role: 'Gestor' }));
        showAlert('Login realizado! Redirecionando...', 'success');
        setTimeout(() => { window.location.href = 'app.html'; }, 700);
      } catch (err) {
        showAlert(err.message || 'Usuário ou senha incorretos.', 'error');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(on) {
      document.getElementById('btn-login').disabled = on;
      document.getElementById('btn-login-text').textContent = on ? 'Entrando...' : 'Entrar';
      document.getElementById('btn-login-spinner').classList.toggle('hidden', !on);
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alert-box');
      box.className = 'alert alert-' + type;
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      box.innerHTML = '<i class="fa ' + icon + '"></i> ' + msg;
    }

    function clearAlert() {
      const box = document.getElementById('alert-box');
      box.className = 'alert hidden';
      box.textContent = '';
    }

    function setFieldError(id, on) {
      document.getElementById(id).closest('.form-group').classList.toggle('has-error', on);
    }

    function isValidEmail(e) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    }

    function toggleEye(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
